name: pages

# Publishes mc.spiky.team as it was on the former host: the landing page is
# prerendered from nuxt/ in SpikyMC-Sites by .github/workflows/nuxt-dist.yml
# (which pushes it under the trees below), and the launcher's data trees are
# copied next to it here.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # gh-pages carries the prerendered landing page and the metadata bundle
      - uses: actions/checkout@v4
        with:
          repository: SpikyTeam/mc.spiky.team
          token: ${{ secrets.PUBLISH_TOKEN }}
          ref: gh-pages
          path: site

      - uses: actions/checkout@v4
        with:
          repository: SpikyTeam/SpikyMC-Sites
          token: ${{ secrets.PUBLISH_TOKEN }}
          path: sources

      - name: Assemble
        run: bash sources/.github/workflows/assemble-mc.sh site sources build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
